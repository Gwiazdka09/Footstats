[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "footstats"
version = "3.4"
description = "Football statistics and prediction engine (Poisson + ML)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    # BAZA, nie extra: `pandas.read_parquet` nie ma wbudowanego czytnika — bez
    # pyarrow leci ImportError. Nie bylo tego NIGDZIE, a lokalnie dziala, bo
    # pyarrow wchodzi przy okazji innych pakietow. W obrazach prod nie wchodzilo,
    # wiec `load_cached()` wywalalo sie w kazdym kontenerze, a quick_picks lapie
    # to pod except i cicho schodzi z Poissona-DC na Bzzoiro-ML: dataset jechal
    # do obu obrazow i ani razu nie dal sie odczytac (sprawdzone 2026-08-07 na
    # realnych obrazach footstats-api i footstats-jobs).
    "pyarrow>=15.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # pydantic i starlette to zaleznosci PRZECHODNIE fastapi, ale importujemy je
    # WPROST (api/auth.py, api/main.py, core/data.py, core/response_cache.py).
    # Deklarujemy jawnie — inaczej zmiana zaleznosci fastapi moze je zabrac.
    "pydantic>=2.0",
    "starlette>=0.37",
    # BAZA, nie [scraper]: bs4 jest potrzebne rowniez w obrazie API, bo
    # core/coupon_settlement.py woła scrapers/flashscore_results (fallback wynikow).
    # Bylo tylko w [scraper] → Dockerfile.api (".[api]") go NIE mial, wiec fallback
    # rozliczen cicho nie dzialal (import pod try/except → BeautifulSoup=None).
    # Ten sam brak wywalal 3 testy understat na CI (job test instaluje bez [scraper]).
    "beautifulsoup4>=4.12",
    # PyJWT zamiast `python-jose` (23.08): jose ciagnela `ecdsa` z PYSEC-2026-1325,
    # ktore `pip-audit` musialo wyciszac. Wyciszona luka w bibliotece kryptograficznej
    # to dlug rosnacy w ciszy — przy nastepnym CVE nikt nie odrozni "znane" od "nowe".
    # PyJWT byl juz w obrazie jako zaleznosc przechodnia; teraz jest jawna, bo
    # `api/auth.py` woła go wprost.
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "fastapi-mcp>=0.3,<0.5",
    # `mcp` to zaleznosc PRZECHODNIA fastapi-mcp, deklarowana tam jako `mcp>=1.12.0`
    # BEZ gornej granicy — swieza instalacja ciagnela wiec mcp 2.0.0, ktore zmienilo
    # sygnature `Server.__init__` na przyjmujaca tylko `name`. fastapi-mcp 0.4.0
    # (najnowszy) wola `Server(name, description)` -> TypeError przy imporcie
    # api.main -> CI nie zebralo ANI JEDNEGO testu (10 collection errors).
    #
    # DOLNA granica to wymog BEZPIECZENSTWA, nie wygody: mcp < 1.27.2 ma
    # PYSEC-2026-3481 i -3482, a PYSEC-2026-3483 jest naprawione dopiero w 1.28.1.
    # Pierwsza wersja tego przypiecia miala `<1.28` i zablokowala projekt na
    # podatnym 1.27.1 — pip-audit w CI slusznie to zlapal.
    "mcp>=1.28.1,<2.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
api = [
    "sentry-sdk[fastapi]>=2.0",
    "psycopg2-binary>=2.9",
]
ai = [
    "groq>=0.4",
    "langfuse>=2.0",
    # Isotonic Regression w core/probability_calibrator.fit_calibrator().
    # Nie byl zadeklarowany NIGDZIE (ani pyproject, ani requirements, ani Dockerfile),
    # a import siedzi pod try/except ImportError → na produkcji refit kalibracji
    # zawsze konczyl sie logiem "sklearn not available — calibrator skipped".
    # Wolane z evening_agent.py:247 (obraz jobs ma [ai]), wiec [ai] wystarczy —
    # obraz API pozostaje bez tej zaleznosci.
    "scikit-learn>=1.3",
]
scraper = [
    "playwright>=1.40",
]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
dashboard = [
    "streamlit>=1.32",
]
cloud = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.scripts]
footstats = "footstats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"footstats.data" = ["*.md", "*.json", "*.csv"]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (fast, no external dependencies)",
    "integration: integration tests (may require network or credentials)",
    "slow: slow tests",
]
testpaths = ["tests"]
python_files = "test_*.py"

# ── Lint (ruff) ────────────────────────────────────────────────────────────
# Gate CI start: błędy składni (E9) + pyflakes (F: martwe importy/zmienne,
# undefined, redefinicje). Stylistyka E4/E7 (import-not-at-top, multi-statement,
# ambiguous-name) ODŁOŻONA — rozsiana po legacy/god-modułach, ratchet później.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-eksportuje publiczne API → F401 (unused-import) zamierzone.
"__init__.py" = ["F401"]
# Testy: nieużywane bindowanie lokalne (np. response = client.get(...) dla
# side-effectu cache) to częsty, niskoryzykowny wzorzec → F841 wyłączone.
"tests/*" = ["F841"]

# ── Type-check (mypy) ──────────────────────────────────────────────────────
# Lenient na starcie (legacy nietypowany): brak strict, milczące importy.
# Gate CI obejmuje wąski czysty zakres (scrapers/sources) — ratchet w górę.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
check_untyped_defs = false
disable_error_code = ["import-untyped"]
