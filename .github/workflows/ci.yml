name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      # ruff: błędy składni (E9) + pyflakes (F) na całym repo — blokujący.
      - name: Ruff lint
        run: python -m ruff check src/ tests/

      # mypy: ratchet 28.08 — scrapers/sources + db + api (wszystkie na zero bledow).
      # Zakres byl waski NIE Z WYBORU: `python_version = "3.11"` w pyproject
      # wywalalo mypy na stubach numpy (skladnia `type` z 3.12) przy pierwszym
      # module importujacym numpy, wiec dalo sie bramkowac tylko katalog, ktory
      # numpy nie dotyka. Po naprawie widac reszte dlugu: core 69, scrapers 36,
      # utils 17, ai 11 bledow. Kolejny ratchet po ich splaceniu.
      - name: Mypy type-check (scrapers/sources)
        run: python -m mypy src/footstats/scrapers/sources/ src/footstats/db/ src/footstats/api/

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      # bandit (SAST): blokuje przy MEDIUM+ severity. False-positive oznaczone # nosec.
      - name: Bandit SAST (src)
        run: python -m bandit -r src/footstats -ll

      # pip-audit: CVE w zależnościach FootStats. Skanujemy DOKŁADNIE te dwa locki,
      # które instalują obrazy (Dockerfile.api / Dockerfile.jobs) — nie ręczne lustro.
      # Do 23.08 szło to przez `requirements.txt`: listę przepisywaną ręcznie, istniejącą
      # wyłącznie dla tego skanu. Zmierzone przed zmianą: zbiory były wtedy IDENTYCZNE
      # (83 pakiety, zero różnic w wersjach), więc dziury nie było — ale ta zgodność
      # brała się ze świeżości locka, nie z konstrukcji. Locki są przypięte celowo,
      # a zakresy `>=` rozjeżdżają się ku nowszym wydaniom, więc skan zacząłby dotyczyć
      # wersji, których nikt nie uruchamia. Lustro w dodatku raz już zdryfowało —
      # wypadły z niego m.in. beautifulsoup4, psycopg2-binary, sentry-sdk i langfuse.
      # Niezmiennika „skanujemy to, co instalujemy" pilnuje
      # tests/test_audyt_skanuje_to_co_jedzie.py.
      # BEZ `--ignore-vuln` od 23.08: jedyne wyciszenie (PYSEC-2026-1325 w `ecdsa`) zniknęło
      # razem z `python-jose` — `api/auth.py` woła teraz PyJWT, a `ecdsa` wypadła z locka.
      # Nie dopisuj tu nowych wyciszeń bez daty i powodu: wyciszona luka w bibliotece
      # kryptograficznej to dług rosnący w ciszy — przy następnym CVE nikt nie odróżni
      # „znane i zaakceptowane" od „nowe".
      - name: pip-audit (dependency CVE)
        run: python -m pip_audit -r requirements-api.lock -r requirements-jobs.lock

  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pełna historia — gitleaks skanuje też stare commity

      # gitleaks: skan sekretów (klucze/hasła) wg .gitleaks.toml
      #
      # BINARKA, nie `gitleaks/gitleaks-action@v2`: akcja przed skanem pyta API
      # GitHuba o typ konta, żeby sprawdzić, czy wymagana jest licencja. Krok nie
      # dostawał `GITHUB_TOKEN`, więc pytanie szło anonimowo ze współdzielonego
      # IP runnera i łapało limit zapytań; wtedy akcja nie potrafi stwierdzić, że
      # repo jest publiczne i pada z "missing gitleaks license" (2026-09-21 na
      # main, wcześniej 2026-09-01 na gałęzi). Sama binarka jest na MIT i nie robi
      # ŻADNEGO zapytania do API — znika cała ta klasa awarii razem z pytaniem
      # o licencję. Wersja i suma SHA-256 przypięte: pobieranie z sieci w CI bez
      # weryfikacji byłoby dziurą w łańcuchu dostaw.
      #
      # Dependabot nie jest już pomijany — binarka nie potrzebuje sekretów, więc
      # read-only token na jego PR-ach niczego nie psuje, a skan obejmuje też je.
      #
      # `gitleaks git` skanuje CAŁĄ historię, nie tylko nowe commity jak robiła
      # akcja. Pierwsze takie przejście (21.09) dało 13 trafień z marca–maja:
      # sumy SHA-256 i stałe testowe — wszystkie obsłużone allowlistą.
      - name: Gitleaks secret scan
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          PLIK="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/$PLIK" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$PLIK"
          echo "$GITLEAKS_SHA256  /tmp/$PLIK" | sha256sum -c -
          tar -xzf "/tmp/$PLIK" -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner

  test:
    runs-on: ubuntu-latest

    env:
      FOOTBALL_API_KEY: "test"
      APISPORTS_KEY: "test"
      BZZOIRO_KEY: "test"
      GROQ_API_KEY: "test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,ai]"

      # --cov-fail-under: floor anty-regresyjny. UWAGA: mierz na CI (Linux),
      # NIE lokalnie (Windows) — CI skipuje więcej testów (opt-deps) → niższe %.
      # Historia: 56 (start) → 60 → 64 (2026-07-30) → 72 (2026-08-01) → 78 (2026-08-24).
      # Pomiar 2026-08-24 z logu CI (run 2a86f2309): 80.31%, lokalnie 81%.
      # Prog 72 zostawial 8 pp luzu — tyle pokrycia dalo sie skasowac bez czerwonego
      # builda, wiec bramka nie chronila przed regresja, tylko przed katastrofa.
      # 78 zostawia ~2.3 pp na wahania miedzy przebiegami (opt-deps, skipy).
      # Cel docelowy 80% (jak mypy w lint) — zostalo ~700 instrukcji.
      - name: Run tests + coverage gate
        run: >
          python -m pytest tests/ --tb=short
          --cov=src/footstats --cov-report=term-missing --cov-fail-under=78

      - name: Check imports
        run: python -c "import footstats; print('Import OK')"

  # Front miał 0 testów przy 4500+ backendowych (znalezisko F3 z audytu 17.08),
  # więc każda zmiana w 14 komponentach była weryfikowana wyłącznie okiem.
  # Osobny job: nie blokuje testów Pythona i odwrotnie.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/footstats/gui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/footstats/gui/package-lock.json

      # `--legacy-peer-deps`, bo tego samego przełącznika używa build na Vercelu
      # (vercel.json) — CI ma instalować to samo drzewo zależności co produkcja.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Vitest
        run: npm test

      # Build łapie błędy, których testy jednostkowe nie widzą (import z literówką,
      # niepoprawny JSX w komponencie bez testu).
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f Dockerfile.api -t footstats-api:ci .

      - name: Verify health endpoint in container
        run: |
          docker run --rm -d -p 8000:8000 \
            -e SECRET_KEY="test-secret-key-32-chars-long!!" \
            -e ALLOWED_ORIGINS="http://localhost:3000" \
            --name footstats-ci footstats-api:ci
          sleep 8
          curl -f http://localhost:8000/health
          docker stop footstats-ci
