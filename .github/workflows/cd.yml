name: CD — Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  IMAGE: europe-west1-docker.pkg.dev/footstats-495009/footstats/footstats-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.CLOUD_RUN_SERVICE }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          # Jawnie re-asertujemy krytyczne env/sekrety przy KAZDYM deployu, zeby
          # przypadkowa reczna chirurgia na serwisie nie mogla znow zdmuchnac
          # logowania (incydent 2026-07-27: brak JWT_SECRET -> login 500).
          # Strategia 'merge' NIE rusza pozostalych zmiennych (np. ALLOWED_ORIGINS,
          # ENSEMBLE_MARKET_WEIGHT ustawionych na serwisie).
          env_vars: |
            ENV=production
          env_vars_update_strategy: merge
          # UWAGA: tylko sekrety ktore JUZ sa typu secretKeyRef na serwisie —
          # proba zmiany typu w locie daje "Cannot update environment variable to
          # the given type" i wywala deploy.
          # CRON_SECRET dopisany 2026-08-14: do tego dnia byl PLAIN env var, wiec
          # nie mogl tu stac. Byl przez to jedynym sekretem, ktorego CD nie
          # re-asertowalo — a jego wartosc dalo sie odczytac zwyklym
          # `gcloud run services describe` (tak wlasnie wyciekla 14.08 i wymusila
          # rotacje). Teraz jest secretKeyRef, wiec deploy go pilnuje jak reszty.
          # BZZOIRO_KEY + APISPORTS_KEY doszly 2026-07-29: serwis ich NIE MIAL, przez co
          # /cron/draft od migracji na Supabase (20.07) zwracal {'ok': False, 'error':
          # 'brak BZZOIRO_KEY'} przy HTTP 200 -> System paper-trading utworzyl 0 kuponow
          # przez 9 dni. Joby footstats-final/evening te klucze mialy, dlatego predykcje
          # szly dalej i awaria nie rzucala sie w oczy.
          # Kazdy sekret z tej listy MUSI istniec w Secret Managerze — dopisanie
          # nieistniejacego wywala deploy, wiec najpierw `gcloud secrets list`.
          secrets: |
            JWT_SECRET=JWT_SECRET:latest
            FOOTSTATS_USER=FOOTSTATS_USER:latest
            FOOTSTATS_PASSWORD_HASH=FOOTSTATS_PASSWORD_HASH:latest
            DATABASE_URL=DATABASE_URL:latest
            BZZOIRO_KEY=BZZOIRO_KEY:latest
            APISPORTS_KEY=APISPORTS_KEY:latest
            ODDS_API_KEY=ODDS_API_KEY:latest
            CRON_SECRET=CRON_SECRET:latest
          secrets_update_strategy: merge

      - name: Verify deployment health
        run: |
          URL=$(gcloud run services describe ${{ secrets.CLOUD_RUN_SERVICE }} \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)')
          curl -f "$URL/health"
